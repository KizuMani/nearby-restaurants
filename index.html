<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src https://overpass-api.de https://overpass.private.coffee https://overpass.kumi.systems https://nominatim.openstreetmap.org; base-uri 'none'; form-action 'none'">
<title>近くのごはん</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23d9ecbd'/%3E%3Cpath d='M16 6a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z' fill='%232d8540'/%3E%3Ccircle cx='16' cy='13' r='2.8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* クリーム色の地に、パステルのグリーンと水色、差し色のオレンジ。上にタイトルと街のイラスト、その下端に重ねた白いカードで検索する */
:root {
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  --cream: #f8f4ea;
  --card: #ffffff;
  --text: #4a3d2e;         /* あたたかい茶色 */
  --sub: #6b6050;
  --line: #e8e0cc;
  --ground: #d9ecbd;       /* イラストの芝生色 */
  --green: #2d8540;
  --green-soft: #e3f3d5;
  --green-line: #9fcf7f;
  --green-text: #2b6a2f;
  --blue: #1d6b84;
  --blue-soft: #e0f1f6;
  --blue-line: #9ccfe0;
  --orange: #f3b146;
  --orange-soft: #fff1d3;
  --orange-text: #7a4f08;
  --pin: #3f9d4e;          /* 地図のお店ピン */
  --pin-sel: #f08a3c;      /* 選択中のピン */
  --you: #3b9de0;
  --shadow: 0 10px 26px rgba(120, 140, 80, .18);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--text); font: 15px/1.6 var(--font); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; }

/* 上部：タイトルと街のイラスト */
.hero { padding-block: 22px 0; }
.brand {
  display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 6px 16px 6px 10px;
  border-radius: 999px; background: var(--card); box-shadow: 0 2px 10px rgba(120, 140, 80, .16);
  font-size: 14px; font-weight: 700; color: var(--green); letter-spacing: .04em;
}
.brand svg { width: 20px; height: 20px; flex: none; }
.catch { margin: 14px 0 0; font-size: clamp(24px, 7vw, 34px); font-weight: 500; letter-spacing: .06em; line-height: 1.5; }
.catch b { font-weight: 700; color: var(--green); }
.lead { margin: 6px 0 0; color: var(--sub); font-size: 13px; }
.scene {
  margin-top: 16px; aspect-ratio: 16 / 10; max-height: 420px; width: 100%;
  border-radius: 28px; overflow: hidden; background: var(--ground);
}
.scene svg { display: block; width: 100%; height: 100%; }
.bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

/* 検索カード */
.panel {
  margin-top: -44px; padding: 14px; display: grid; gap: 10px; position: relative;
  background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
}
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
button, select, input[type=search] {
  font: inherit; color: inherit; min-height: 44px;
  border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); padding: 8px 16px;
}
button { cursor: pointer; transition: transform .12s ease; }
button:active { transform: scale(.97); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--blue-line); outline-offset: 2px; }
.primary {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; font-weight: 700; color: #fff; background: var(--green);
  box-shadow: 0 4px 12px rgba(45, 133, 64, .28);
}
.primary svg { width: 18px; height: 18px; flex: none; }
select { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); font-weight: 700; }
input[type=search] { flex: 1; background: var(--cream); }
input[type=search]::placeholder { color: #9a8f7c; }
.soft { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); font-weight: 700; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; min-height: 38px; padding: 6px 16px; font-size: 14px; }
.chip[aria-pressed=true] { background: var(--green-soft); border-color: var(--green-line); color: var(--green-text); font-weight: 700; }
.tools { justify-content: space-between; }
label.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--sub); white-space: nowrap; min-height: 44px; }
label.toggle input { width: 20px; height: 20px; accent-color: var(--green); }
#random { background: var(--orange-soft); border-color: var(--orange); color: var(--orange-text); font-weight: 700; }

/* 地図 */
#map {
  height: 280px; margin-top: 16px; border-radius: 24px; overflow: hidden;
  box-shadow: var(--shadow); border: 1px solid var(--line); z-index: 0;
}
.leaflet-tile-pane { filter: saturate(.68) brightness(1.05) contrast(.95); }
.leaflet-container { font-family: var(--font); background: #e9f3e4; }

#status { padding: 14px 4px 8px; color: var(--sub); font-size: 13px; min-height: 40px; }
#status.error { color: #b83a3a; }

/* お店の一覧 */
#list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.card {
  background: var(--card); border: 1.5px solid transparent; border-radius: 20px;
  padding: 14px 16px; box-shadow: 0 3px 14px rgba(120, 140, 80, .13); scroll-margin-top: 12px; cursor: pointer;
}
.card.selected { border-color: var(--green-line); box-shadow: 0 0 0 4px rgba(124, 184, 102, .22); }
.top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.name { font-weight: 700; font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.dist {
  flex: none; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: #f4efdf; color: #6b5a3f; font-variant-numeric: tabular-nums;
}
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; }
.tag { border-radius: 999px; padding: 2px 10px; background: #efeadc; color: #6b6050; }
.tag.genre { background: var(--blue-soft); color: var(--blue); }
.tag.open { background: var(--green-soft); color: var(--green-text); font-weight: 700; }
.tag.open::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
.hours { margin-top: 6px; font-size: 12px; color: var(--sub); overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.links a {
  display: inline-flex; align-items: center; min-height: 36px; padding: 4px 14px; border-radius: 999px;
  font-size: 14px; font-weight: 700; text-decoration: none; color: var(--blue); background: var(--blue-soft);
}
.links a:first-child { color: #fff; background: var(--green); }

#more { display: block; margin: 18px auto 0; min-width: 160px; }
footer { padding-block: 28px 40px; color: var(--sub); font-size: 12px; line-height: 1.7; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } .bob { animation: none; } }
</style>
</head>
<body>
<header class="hero wrap">
  <h1 class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7.5 7.5 0 0 0-7.5 7.5C4.5 15 12 22 12 22s7.5-7 7.5-12.5A7.5 7.5 0 0 0 12 2z" fill="#2d8540"/><circle cx="12" cy="9.5" r="3" fill="#fff"/></svg>
    近くのごはん
  </h1>
  <p class="catch">歩いて行ける、<br><b>おいしい</b>を見つけよう。</p>
  <p class="lead">現在地や駅名から、近くの飲食店をさがせます。</p>
  <div class="scene" id="scene" role="img" aria-label="パステルグリーンと水色で描いた、レストランやカフェのある街並みのイラスト"></div>
</header>

<main class="wrap">
  <section class="panel" aria-label="検索条件">
    <div class="row">
      <button id="locate" class="primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
        現在地から探す
      </button>
      <select id="radius" aria-label="検索範囲">
        <option value="300">300m</option>
        <option value="500" selected>500m</option>
        <option value="1000">1km</option>
        <option value="2000">2km</option>
      </select>
    </div>
    <form id="searchForm" class="row">
      <input id="place" type="search" placeholder="駅名・地名で探す（例：渋谷駅）" aria-label="場所を検索">
      <button type="submit" class="soft">検索</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="row tools">
      <label class="toggle"><input type="checkbox" id="openOnly"> 営業中のみ</label>
      <button id="random" disabled>今日はここ！</button>
    </div>
  </section>

  <div id="map"></div>
  <div id="status">「現在地から探す」を押すか、駅名や地名を入力してください。</div>
  <ul id="list"></ul>
  <button id="more" hidden>もっと見る</button>
</main>

<footer class="wrap">
  お店のデータ：<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>。
  評価・口コミのデータはありません。「おすすめ順」は営業中か・距離・登録情報の充実度で並べています。営業時間は未登録・古い場合があります。
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/i18next@21.10.0/dist/umd/i18next.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opening_hours@3.8.0/build/opening_hours.min.js" onerror="console.warn('opening_hours.js を読み込めませんでした（営業中判定なしで動作します）')"></script>
<script>
'use strict';

// ---------- 上部の街のイラスト（アイソメ図をその場で描画） ----------
function buildTown() {
  const U = 40, A = U * 0.866, B = U * 0.5, OX = 450, OY = 100;
  const P = (x, y, z = 0) => [OX + (x - y) * A, OY + (x + y) * B - z * U];   // 格子座標 → 画面座標
  const f = n => Math.round(n * 10) / 10;
  const pts = a => a.map(p => f(p[0]) + ',' + f(p[1])).join(' ');
  const poly = (a, fill, extra = '') => `<polygon points="${pts(a)}" fill="${fill}" stroke="${fill}" stroke-width=".7" stroke-linejoin="round" ${extra}/>`;
  const soft = (a, fill, r) => `<polygon points="${pts(a)}" fill="${fill}" stroke="${fill}" stroke-width="${r}" stroke-linejoin="round"/>`;
  const rect = (x1, y1, x2, y2) => [P(x1, y1), P(x2, y1), P(x2, y2), P(x1, y2)];

  const items = [];
  let g0 = -1000;
  const ground = s => items.push({ d: g0++, s });
  const add = (d, s) => items.push({ d, s });

  const W = { top: '#f4fbfc', left: '#e0f2f5', right: '#c8e6eb' };          // 壁
  const GLASS_L = '#a9d6e6', GLASS_R = '#8fc3d8', WOOD = '#d9b27c';

  // 立方体：左面（+y側）・右面（+x側）・上面
  const box = (x, y, w, d, h, c, z0 = 0, noTop = false) => {
    const t = [P(x, y, z0 + h), P(x + w, y, z0 + h), P(x + w, y + d, z0 + h), P(x, y + d, z0 + h)];
    const l = [P(x, y + d, z0 + h), P(x + w, y + d, z0 + h), P(x + w, y + d, z0), P(x, y + d, z0)];
    const r = [P(x + w, y, z0 + h), P(x + w, y + d, z0 + h), P(x + w, y + d, z0), P(x + w, y, z0)];
    return poly(l, c.left) + poly(r, c.right) + (noTop ? '' : poly(t, c.top));
  };
  const shadow = (x, y, w, d) => poly([P(x, y), P(x + w + .7, y), P(x + w + .7, y + d + .7), P(x, y + d + .7)], '#5d8a3a', 'opacity=".16"');
  const winL = (x1, x2, yy, z1, z2, fill = GLASS_L) => poly([P(x1, yy, z2), P(x2, yy, z2), P(x2, yy, z1), P(x1, yy, z1)], fill);
  const winR = (xx, y1, y2, z1, z2, fill = GLASS_R) => poly([P(xx, y1, z2), P(xx, y2, z2), P(xx, y2, z1), P(xx, y1, z1)], fill);

  // 切妻屋根の家（棟がx方向）
  const house = (x, y, w, d, h, rh, roof) => {
    const ym = y + d / 2, oh = .15, ov = .12;
    const l = [P(x, y + d, h), P(x + w, y + d, h), P(x + w, y + d, 0), P(x, y + d, 0)];
    const r = [P(x + w, y, h), P(x + w, y + d, h), P(x + w, y + d, 0), P(x + w, y, 0)];
    return shadow(x, y, w, d)
      + poly(l, W.left) + poly(r, W.right)
      + poly([P(x - oh, y - ov, h), P(x + w + oh, y - ov, h), P(x + w + oh, ym, h + rh), P(x - oh, ym, h + rh)], roof.back)
      + poly([P(x + w, y, h), P(x + w, y + d, h), P(x + w, ym, h + rh)], W.right)
      + poly([P(x - oh, ym, h + rh), P(x + w + oh, ym, h + rh), P(x + w + oh, y + d + ov, h), P(x - oh, y + d + ov, h)], roof.front)
      + winL(x + .25, x + .75, y + d, .3, .85) + winL(x + w - .75, x + w - .25, y + d, .3, .85)
      + poly([P(x + w * .42, y + d, 0), P(x + w * .58, y + d, 0), P(x + w * .58, y + d, .8), P(x + w * .42, y + d, .8)], WOOD)
      + winR(x + w, y + d * .3, y + d * .7, .3, .8);
  };

  // 木・植物・人など
  const tree = (x, y, s = 1) => {
    const [px, py] = P(x, y);
    const c = (cx, cy, r, fill) => `<circle cx="${f(px + cx * s)}" cy="${f(py + cy * s)}" r="${f(r * s)}" fill="${fill}"/>`;
    return `<ellipse cx="${f(px)}" cy="${f(py + 2)}" rx="${f(18 * s)}" ry="${f(7 * s)}" fill="#5d8a3a" opacity=".2"/>`
      + `<rect x="${f(px - 2.5 * s)}" y="${f(py - 14 * s)}" width="${f(5 * s)}" height="${f(14 * s)}" rx="2" fill="#8b7a5c"/>`
      + c(-10, -26, 13, '#6aa957') + c(11, -27, 12, '#6aa957') + c(0, -36, 14, '#6aa957')
      + c(-3, -24, 13, '#7dba68') + c(-6, -37, 8, '#93cc78');
  };
  const pine = (x, y, s = 1) => {
    const [px, py] = P(x, y);
    const tri = (w, top, bot, fill) => `<polygon points="${f(px - w * s)},${f(py - bot * s)} ${f(px + w * s)},${f(py - bot * s)} ${f(px)},${f(py - top * s)}" fill="${fill}" stroke="${fill}" stroke-width="5" stroke-linejoin="round"/>`;
    return `<ellipse cx="${f(px)}" cy="${f(py + 2)}" rx="${f(14 * s)}" ry="${f(5.5 * s)}" fill="#5d8a3a" opacity=".2"/>`
      + `<rect x="${f(px - 2 * s)}" y="${f(py - 12 * s)}" width="${f(4 * s)}" height="${f(12 * s)}" fill="#8b7a5c"/>`
      + tri(15, 36, 11, '#b3dc66') + tri(11, 54, 28, '#c8ec7e');
  };
  const person = (x, y, shirt, hair, s = 1.25) => {
    const [px, py] = P(x, y);
    return `<ellipse cx="${f(px)}" cy="${f(py + 1)}" rx="${f(7 * s)}" ry="${f(2.6 * s)}" fill="#5d8a3a" opacity=".25"/>`
      + `<rect x="${f(px - 3.6 * s)}" y="${f(py - 9 * s)}" width="${f(2.8 * s)}" height="${f(9 * s)}" rx="1.2" fill="#5b7587"/>`
      + `<rect x="${f(px + .8 * s)}" y="${f(py - 9 * s)}" width="${f(2.8 * s)}" height="${f(9 * s)}" rx="1.2" fill="#4a6577"/>`
      + `<rect x="${f(px - 5 * s)}" y="${f(py - 22 * s)}" width="${f(10 * s)}" height="${f(14 * s)}" rx="${f(4 * s)}" fill="${shirt}"/>`
      + `<circle cx="${f(px)}" cy="${f(py - 27 * s)}" r="${f(4.6 * s)}" fill="#ffdcb8"/>`
      + `<path d="M${f(px - 4.9 * s)},${f(py - 27.4 * s)} A${f(4.9 * s)},${f(4.9 * s)} 0 0 1 ${f(px + 4.9 * s)},${f(py - 27.4 * s)} Z" fill="${hair}"/>`;
  };
  const dog = (x, y) => {
    const [px, py] = P(x, y);
    return `<ellipse cx="${f(px)}" cy="${f(py - 6)}" rx="7.5" ry="4.2" fill="#a67c52"/><circle cx="${f(px + 7.5)}" cy="${f(py - 10)}" r="3.4" fill="#a67c52"/>`
      + `<rect x="${f(px - 5.5)}" y="${f(py - 4)}" width="2" height="4.5" fill="#8d6842"/><rect x="${f(px + 3)}" y="${f(py - 4)}" width="2" height="4.5" fill="#8d6842"/>`;
  };
  const lamp = (x, y) => {
    const [px, py] = P(x, y);
    return `<line x1="${f(px)}" y1="${f(py)}" x2="${f(px)}" y2="${f(py - 36)}" stroke="#7f8d9b" stroke-width="3" stroke-linecap="round"/>`
      + `<circle cx="${f(px)}" cy="${f(py - 39)}" r="4.6" fill="#fff6cf" stroke="#7f8d9b" stroke-width="2"/>`;
  };
  const pole = (x, y) => {
    const a = P(x, y), b = P(x, y, 2.5);
    return `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#cdd7dc" stroke-width="3.4" stroke-linecap="round"/>`
      + `<line x1="${f(b[0] - 10)}" y1="${f(b[1] + 3)}" x2="${f(b[0] + 10)}" y2="${f(b[1] - 3)}" stroke="#cdd7dc" stroke-width="2.8" stroke-linecap="round"/>`;
  };
  const wire = (p, q) => {
    const a = P(p[0], p[1], 2.5), b = P(q[0], q[1], 2.5), sag = 10;
    return [-4, 4].map(o => `<path d="M${f(a[0] + o)},${f(a[1] + o * .4)} Q${f((a[0] + b[0]) / 2)},${f((a[1] + b[1]) / 2 + sag)} ${f(b[0] + o)},${f(b[1] + o * .4)}" fill="none" stroke="#f2ad3f" stroke-width="1.7" opacity=".95"/>`).join('');
  };
  const parasol = (x, y, color) => {
    const [px, py] = P(x, y);
    return `<ellipse cx="${f(px)}" cy="${f(py)}" rx="11" ry="5" fill="#fff"/>`
      + `<line x1="${f(px)}" y1="${f(py)}" x2="${f(px)}" y2="${f(py - 28)}" stroke="#9a8f7c" stroke-width="2.2"/>`
      + `<path d="M${f(px - 20)},${f(py - 27)} Q${f(px)},${f(py - 44)} ${f(px + 20)},${f(py - 27)} Z" fill="${color}"/>`;
  };
  const car = (x, y, c) => {                      // x方向に走る車
    const cab = { top: c.top, left: c.left, right: c.right };
    const [w1x, w1y] = P(x + .3, y + .62, .1), [w2x, w2y] = P(x + 1.0, y + .62, .1);
    return shadow(x, y, 1.3, .62) + box(x, y, 1.3, .62, .3, c, .1) + box(x + .3, y + .04, .65, .54, .26, cab, .4)
      + winL(x + .34, x + .9, y + .58, .44, .62, '#c5e7f2') + winR(x + .95, y + .1, y + .5, .44, .62, '#9fcfe0')
      + `<ellipse cx="${f(w1x)}" cy="${f(w1y)}" rx="5" ry="5.6" fill="#47586a"/><ellipse cx="${f(w2x)}" cy="${f(w2y)}" rx="5" ry="5.6" fill="#47586a"/>`;
  };
  const truck = (x, y) => {                       // y方向に走る配達トラック

// ---------- 検索アプリ本体 ----------

// 無料の公開サーバーは混み合うことがあるため、本家を再試行したあとミラーへ切り替える
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
];
const TIMEOUT_MS = 15000;
const PAGE = 30;

const GENRES = {
  all:  { label: 'すべて' },
  meal: { label: '食事',         test: p => p.amenity === 'restaurant' || p.amenity === 'fast_food' },
  cafe: { label: 'カフェ',       test: p => p.amenity === 'cafe' },
  bar:  { label: '居酒屋・バー', test: p => p.amenity === 'bar' || p.amenity === 'pub' || p.cuisines.includes('izakaya') },
};
const AMENITY_JA = { restaurant: 'レストラン', cafe: 'カフェ', fast_food: 'ファストフード', bar: 'バー', pub: 'パブ' };
const CUISINE_JA = {
  japanese: '和食', sushi: '寿司', ramen: 'ラーメン', noodle: '麺類', udon: 'うどん', soba: 'そば',
  izakaya: '居酒屋', yakiniku: '焼肉', tempura: '天ぷら', tonkatsu: 'とんかつ', curry: 'カレー',
  chinese: '中華', korean: '韓国料理', italian: 'イタリアン', pizza: 'ピザ', french: 'フレンチ',
  burger: 'ハンバーガー', sandwich: 'サンドイッチ', coffee_shop: 'コーヒー', thai: 'タイ料理',
  indian: 'インド料理', vietnamese: 'ベトナム料理', steak_house: 'ステーキ', seafood: '海鮮',
  chicken: 'チキン', donburi: '丼', gyudon: '牛丼', okonomiyaki: 'お好み焼き', regional: '郷土料理',
  asian: 'アジア料理', western: '洋食', dessert: 'デザート', ice_cream: 'アイス', bakery: 'ベーカリー',
};

const state = { lat: null, lon: null, radius: 500, genre: 'all', openOnly: false, places: [], limit: PAGE, selectedId: null };
const $ = s => document.querySelector(s);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------- 小さなユーティリティ ----------
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}
function safeUrl(u) {
  if (!u) return null;
  try {
    const url = new URL(/^https?:\/\//i.test(u) ? u : 'https://' + u);
    return /^https?:$/.test(url.protocol) ? url.href : null;
  } catch { return null; }
}
function safePhone(p) {
  if (!p) return null;
  const first = p.split(';')[0].trim();
  return /^[0-9+\-() ]{5,20}$/.test(first) ? first : null;
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function fmtDist(m) { return m < 1000 ? `${Math.round(m / 10) * 10}m` : `${(m / 1000).toFixed(1)}km`; }
function setStatus(msg, isError = false) {
  const s = $('#status');
  s.textContent = msg;
  s.classList.toggle('error', isError);
}

// ---------- データ取得 ----------
async function fetchPlaces(lat, lon, radius, onRetry) {
  const q = `[out:json][timeout:25];nwr["name"]["amenity"~"^(restaurant|cafe|fast_food|bar|pub)$"](around:${radius},${lat},${lon});out center tags;`;
  let lastErr;
  for (const [i, ep] of OVERPASS.entries()) {
    if (i > 0) { onRetry?.(i, OVERPASS.length - 1); await new Promise(r => setTimeout(r, 1500)); }
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(ep, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(q),
        signal: ac.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // 混雑時は JSON ではなくエラー内容の XML が返るため、パースに失敗したら次のサーバーへ
      const json = JSON.parse(await res.text());
      if (/runtime error|timed out/i.test(json.remark || '')) throw new Error(json.remark);
      return json.elements;
    } catch (e) {
      lastErr = e;
    } finally {
      clearTimeout(timer);
    }
  }
  throw lastErr;
}

function openState(hours) {
  if (!hours || typeof opening_hours === 'undefined') return null;
  try { return new opening_hours(hours).getState(new Date()); } catch { return null; }
}

function normalize(el, lat0, lon0, radius) {
  const t = el.tags || {};
  const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
  if (lat == null || lon == null) return null;
  const cuisines = (t.cuisine || '').split(';').map(s => s.trim()).filter(Boolean);
  const p = {
    id: el.type + el.id,
    name: t['name:ja'] || t.name,
    amenity: t.amenity, cuisines, lat, lon,
    dist: haversine(lat0, lon0, lat, lon),
    hours: t.opening_hours || null,
    website: safeUrl(t.website || t['contact:website']),
    phone: safePhone(t.phone || t['contact:phone']),
  };
  p.open = openState(p.hours);
  p.genreLabel = (cuisines.map(c => CUISINE_JA[c]).filter(Boolean)[0]) || AMENITY_JA[p.amenity] || '飲食店';
  // おすすめ度：営業中を最優先、近さ、登録情報の充実度
  let s = 30 * (1 - Math.min(p.dist / radius, 1));
  if (p.open === true) s += 40; else if (p.open === false) s -= 50;
  if (cuisines.length) s += 8;
  if (p.hours) s += 6;
  if (p.website) s += 6;
  if (p.phone) s += 4;
  p.score = s;
  return p;
}

// ---------- 地図 ----------
const map = L.map('map', { zoomControl: true }).setView([35.681, 139.767], 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);
const layer = L.layerGroup().addTo(map);
let youMarker = null, circle = null;
const markers = new Map();

function drawMap(shown) {
  layer.clearLayers();
  markers.clear();
  if (youMarker) youMarker.remove();
  if (circle) circle.remove();
  youMarker = L.circleMarker([state.lat, state.lon], { radius: 8, color: '#fff', weight: 3, fillColor: css('--you'), fillOpacity: 1 }).addTo(map).bindTooltip('現在地');
  circle = L.circle([state.lat, state.lon], { radius: state.radius, color: css('--you'), weight: 1.5, fillOpacity: 0.06 }).addTo(map);
  for (const p of shown) {
    const m = L.circleMarker([p.lat, p.lon], { radius: 7, color: '#fff', weight: 2, fillColor: css('--pin'), fillOpacity: 0.95 });
    m.bindTooltip(p.name);
    m.on('click', () => select(p.id, true));
    m.addTo(layer);
    markers.set(p.id, m);
  }
}

// ---------- 表示 ----------
function filtered() {
  const g = GENRES[state.genre];
  return state.places
    .filter(p => !g.test || g.test(p))
    .filter(p => !state.openOnly || p.open === true)
    .sort((a, b) => b.score - a.score);
}

function render({ fit = false } = {}) {
  const all = filtered();
  const shown = all.slice(0, state.limit);
  $('#random').disabled = all.length === 0;
  $('#more').hidden = all.length <= state.limit;
  if (state.lat != null) {
    drawMap(shown);
    if (fit) map.fitBounds(circle.getBounds(), { padding: [10, 10] });
  }
  const list = $('#list');
  list.replaceChildren();
  for (const p of shown) list.append(card(p));
  if (state.lat != null) {
    const note = all.length === 0 ? '条件に合うお店が見つかりませんでした。' : `おすすめ順に ${all.length} 件`;
    setStatus(`${note}（半径${state.radius >= 1000 ? state.radius / 1000 + 'km' : state.radius + 'm'}）`);
  }
  if (state.selectedId) markSelected(state.selectedId);
}

function card(p) {
  const gmap = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
  return h('li', { class: 'card', id: 'c-' + p.id, onclick: () => select(p.id, false) },
    h('div', { class: 'top' },
      h('span', { class: 'name' }, p.name),
      h('span', { class: 'dist' }, fmtDist(p.dist))),
    h('div', { class: 'meta' },
      h('span', { class: 'tag genre' }, p.genreLabel),
      p.open === true && h('span', { class: 'tag open' }, '営業中'),
      p.open === false && h('span', { class: 'tag' }, '営業時間外')),
    p.hours && h('div', { class: 'hours' }, p.hours),
    h('div', { class: 'links' },
      h('a', { href: gmap, target: '_blank', rel: 'noopener' }, '地図で開く'),
      p.website && h('a', { href: p.website, target: '_blank', rel: 'noopener' }, 'Webサイト'),
      p.phone && h('a', { href: 'tel:' + p.phone.replace(/[^0-9+]/g, '') }, '電話')));
}

function markSelected(id) {
  document.querySelectorAll('.card.selected').forEach(e => e.classList.remove('selected'));
  document.getElementById('c-' + id)?.classList.add('selected');
  for (const [mid, m] of markers) m.setStyle(mid === id ? { radius: 11, fillColor: css('--pin-sel') } : { radius: 7, fillColor: css('--pin') });
}

function select(id, scrollToCard) {
  state.selectedId = id;
  markSelected(id);
  const m = markers.get(id);
  if (m) { m.bringToFront(); map.panTo(m.getLatLng()); }
  if (scrollToCard) document.getElementById('c-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ---------- 検索の実行 ----------
let searchSeq = 0;
async function searchAt(lat, lon) {
  const seq = ++searchSeq;
  state.lat = lat; state.lon = lon; state.limit = PAGE; state.selectedId = null;
  map.setView([lat, lon], 15);
  setStatus('お店を探しています…');
  $('#list').replaceChildren();
  try {
    const els = await fetchPlaces(lat, lon, state.radius, (n, max) => {
      if (seq === searchSeq) setStatus(`サーバーが混み合っています。再試行しています…（${n}/${max}）`);
    });
    if (seq !== searchSeq) return; // 後から始めた検索を優先する
    state.places = els.map(e => normalize(e, lat, lon, state.radius)).filter(Boolean);
    render({ fit: true });
  } catch (e) {
    console.error(e);
    if (seq === searchSeq) setStatus('お店のデータを取得できませんでした。無料の公開サーバーが混み合っている可能性があります。少し待ってからもう一度お試しください。', true);
  }
}

function locate() {
  if (!navigator.geolocation) { setStatus('このブラウザは位置情報に対応していません。場所を入力してください。', true); return; }
  setStatus('現在地を取得しています…');
  navigator.geolocation.getCurrentPosition(
    pos => searchAt(pos.coords.latitude, pos.coords.longitude),
    err => {
      const msg = err.code === 1 ? '位置情報の利用が許可されていません。ブラウザの設定を確認するか、場所を入力してください。'
                : err.code === 3 ? '現在地の取得がタイムアウトしました。もう一度お試しください。'
                : '現在地を取得できませんでした。場所を入力してください。';
      setStatus(msg, true);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

async function searchPlaceName(q) {
  setStatus('場所を探しています…');
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const r = (await res.json())[0];
    if (!r) { setStatus('その場所が見つかりませんでした。', true); return; }
    await searchAt(parseFloat(r.lat), parseFloat(r.lon));
  } catch (e) {
    console.error(e);
    setStatus('場所を検索できませんでした。少し待ってからもう一度お試しください。', true);
  }
}

// ---------- イベント ----------
for (const [key, g] of Object.entries(GENRES)) {
  $('#chips').append(h('button', {
    class: 'chip', 'aria-pressed': String(key === state.genre), 'data-g': key,
    onclick: () => {
      state.genre = key; state.limit = PAGE;
      document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.g === key)));
      render();
    },
  }, g.label));
}
$('#locate').addEventListener('click', locate);
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('#place').value.trim(); if (q) searchPlaceName(q); });
$('#radius').addEventListener('change', e => { state.radius = Number(e.target.value); if (state.lat != null) searchAt(state.lat, state.lon); });
$('#openOnly').addEventListener('change', e => { state.openOnly = e.target.checked; state.limit = PAGE; render(); });
$('#more').addEventListener('click', () => { state.limit += PAGE; render(); });
$('#random').addEventListener('click', () => {
  const pool = filtered().slice(0, 10);
  if (!pool.length) return;
  const p = pool[Math.floor(Math.random() * pool.length)];
  if (!document.getElementById('c-' + p.id)) { state.limit = Math.max(state.limit, filtered().indexOf(p) + 1); render(); }
  select(p.id, true);
});
</script>
